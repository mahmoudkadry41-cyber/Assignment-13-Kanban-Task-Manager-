<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./vite.png">
    <link rel="stylesheet" href="./Src/css/all.min.css">
    <link rel="stylesheet" href="./Src/css/output.css">
    <title>Kanban Task Manager</title>
</head>

<body>
    <section id="MainBody" class="flex flex-col justify-between min-h-screen bg-[#F3F6FB]">
        <nav class="fixed top-0 h-15 left-0 right-0 bg-linear-to-r from-[#5239F7] to-[#9710FA]">
            <div class="container m-auto flex w-full h-full justify-between items-center ps-3 pe-3">
                <button class="text-white text-2xl font-bold">
                    <i class="fa-solid fa-table-columns" style="color: rgb(255, 255, 255);"></i> Kanban
                </button>
                <button id="add-task" class="bg-[#A945FB] hover:bg-[#B45DFC] rounded-sm w-9.5 h-9.5"><i
                        class="fa-solid fa-plus" style="color: rgb(255, 255, 255);"></i>
                </button>

            </div>
        </nav>



        <section class="container mx-auto min-h-full w-full grid grid-cols-1 md:grid-cols-3 gap-5 mt-30">

            <div class="bg-[#FBFCFD] rounded-2xl p-3.5 min-h-121 shadow-lg flex flex-col gap-3 ">
                <div class="w-full min-h-12.5  flex flex-row justify-start items-center gap-2.5 mb-5">
                    <button class="bg-[#F1F5F9] rounded-lg w-9.5 h-9.5"><i class="fa-solid fa-clipboard-list"
                            style="color: #62748e;"></i></button>
                    <div class="flex flex-col gap-1 ">
                        <p class=" leading-none font-medium text-[#1d293d]">To Do</p>
                        <p id="todocounter" class="leading-none font-light text-[#90a1b9] text-sm">0 tasks</p>
                    </div>
                </div>
                <div id="ToDo" class="flex flex-col gap-3">
                    

                </div>


            </div>
            <div class="bg-[#FBFCFD] rounded-2xl p-3.5 min-h-121 shadow-lg flex flex-col gap-4 ">
                <div class="w-full h-12.5  flex flex-row justify-start items-center gap-2.5 mb-5">
                    <button class="bg-[#FFFBEB] rounded-lg w-9.5 h-9.5"><i class="fa-solid fa-spinner"
                            style="color: #FE9A00;"></i></button>
                    <div class="flex flex-col gap-1 ">
                        <p class="leading-none font-medium text-[#1d293d]">In Progress</p>
                        <p id="progresscounter" class="leading-none font-light text-[#90a1b9] text-sm">0 tasks</p>
                    </div>
                </div>
                <div id="InProgress" class="flex flex-col gap-3">
                    
                
                </div>
            </div>
            <div class="bg-[#FBFCFD] rounded-2xl p-3.5 min-h-121 shadow-lg flex flex-col gap-4 ">
                <div class="w-full h-12.5  flex flex-row justify-start items-center gap-2.5 mb-5">
                    <button class="bg-[#ECFDF5] rounded-lg w-9.5 h-9.5"><i class="fa-solid fa-circle-check"
                            style="color: #00BC7D;"></i></button>
                    <div class="flex flex-col gap-1 ">
                        <p class=" leading-none font-medium text-[#1d293d]">Completed</p>
                        <p id="completedcounter" class="leading-none font-light text-[#90a1b9] text-sm">0 tasks</p>
                    </div>
                </div>
                <div id="Completed" class="flex flex-col gap-3">
                   
                
                </div>
            </div>
        </section>



        <div class="h-15 w-screen bg-black mt-4 fixed bottom-0 right-0 left-0">
            <div class="flex justify-center items-center w-full h-full ps-6 pe-6  ">
                <p class="text-[#90a1b9]">Made with <i class="fa-solid fa-heart fa-beat"
                        style="color: rgb(255, 0, 0);"></i> by Route Academy</p>
            </div>
        </div>


    </section>
    <section id="Crud"
        class="h-screen w-full backdrop-blur-md hidden top-0 flex justify-center items-center bg-black/50 ">

        <div class="bg-[#FBFCFD] rounded-2xl h-126 w-150 shadow-lg ">
            <div class="h-20 w-full border-b border-b-gray-200 p-3.5 flex justify-between items-center">
                <p class="text-[#1d293d] text-xl font-bold">Create New Task</p>
                <button id="Close" class="flex justify-center items-center w-7 h-7 rounded-md hover:bg-[#F1F5F9] "><i
                        class="fa-solid fa-x" style="color: #8fa0b8;"></i></button>
            </div>
            <form action="">
                <div class="w-full h-[70%]  p-4 flex gap-2 flex-col ">
                    <label for="taskTitle"><i class="fa-solid fa-h fa-lg" style="color: #8fa0b8;"></i> Task Title <span
                            class="text-red-500">*</span></label>
                    <input type="text"  id="taskTitle" name="taskTitle" placeholder="What needs to be done?"
                        class="rounded-md" >
                </div>
                <div class="flex">
                    <div class="w-full h-[70%] p-4 flex gap-2 flex-col ">
                        <label for="Priority"><i class="fa-solid fa-flag fa-lg" style="color: #8fa0b8;"></i> Priority
                        </label>
                        <select id="Priority" name="Priority" class="rounded-md">
                            <option>Chose a Priority</option>
                            <option>Low</option>
                            <option>Medium</option>
                            <option>High</option>
                        </select>
                    </div>
                    <div class="w-full h-[70%] p-4 flex gap-2 flex-col ">
                        <label for="Date"><i class="fa-solid fa-calendar-days fa-lg" style="color: #8fa0b8;"></i>
                            Date </label>
                        <input type="date" id="Date" name="Date" class="rounded-md">
                    </div>
                </div>
                <div class="w-full h-[70%]  p-4 flex gap-2 flex-col ">
                    <label for="Description"><i class="fa-solid fa-calendar-days fa-lg" style="color: #8fa0b8;"></i>
                        Task
                        Title
                    </label>
                    <textarea name="Description" id="Description" rows="3" class="rounded-md resize-none"
                        placeholder="Add more detailes about this task ! ...."></textarea>

                </div>
            </form>
            <div class="flex justify-around w-full">
                <button id="Cancle"
                    class="w-60 h-10 rounded-md bg-[#F1F5F9] hover:bg-[#E2E8F0] cursor-pointer font-bold text-[#314158]">Cancle</button>
                <button id="AddTask"
                    class="w-60 h-10 bg-[#4F39F6] hover:[#432DD7] rounded-md cursor-pointer font-bold text-white"><i
                        class="fa-solid fa-plus" style="color: rgb(255, 255, 255);"></i> Add task</button>
            </div>

        </div>


    </section>




    <script src="./Src/js/all.min.js"></script>
    <script src="./Src/js/index.js"></script>

</body>

</html>
